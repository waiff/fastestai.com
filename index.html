<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#0A0A0A" />

  <title>fastestAI.com — Privately Held Domain Asset</title>
  <meta name="description" content="fastestAI.com is a privately owned domain asset available for acquisition. Transfer inquiries are handled directly by the owner." />
  <link rel="canonical" href="https://fastestai.com/" />
  <meta name="robots" content="index, follow, noarchive, max-snippet:-1" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />

  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://fastestai.com/" />
  <meta property="og:title" content="fastestAI.com" />
  <meta property="og:description" content="A privately owned domain asset, available for acquisition." />
  <meta name="twitter:card" content="summary" />

  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="mask-icon" href="assets/favicon.svg" color="#FAFAFA" />
  <link rel="apple-touch-icon" href="assets/favicon.svg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" />

  <!-- Runs before first paint: only a scripted browser hides the content it is about to animate. -->
  <script>document.documentElement.classList.add('js');</script>

  <!--
    The stylesheet below is complete and self-sufficient: the page is fully designed
    without a single network request. Tailwind (loaded after it) supplies the layout
    utilities on the markup, but the site never depends on that CDN resolving —
    corporate egress filters and CDN outages are real, and this page has exactly one
    job on first impression.
  -->
  <style>
    :root {
      --ink: #0A0A0A;
      --bone: #FAFAFA;
      --muted: #A1A1AA;
      --hairline: rgba(250, 250, 250, 0.16);
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
      --font-mono: 'JetBrains Mono', 'SF Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: var(--ink);
    }

    body {
      color: var(--bone);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }

    ::selection { background: var(--bone); color: var(--ink); }

    /* A single, very quiet light source behind the content. */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(60rem 40rem at 50% 38%, rgba(255, 255, 255, 0.045), transparent 70%),
        radial-gradient(90rem 60rem at 50% 120%, rgba(255, 255, 255, 0.02), transparent 70%);
    }

    /* ── Layout ─────────────────────────────────────────────────────────── */

    .stage {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100svh;
      max-width: 42rem;
      margin: 0 auto;
      padding: clamp(4rem, 10vh, 9rem) clamp(1.5rem, 6vw, 3rem);
      text-align: center;
    }

    /* ── Type ───────────────────────────────────────────────────────────── */

    .domain {
      margin: 0;
      font-family: var(--font-mono);
      font-size: clamp(1.875rem, 1.15rem + 2.9vw, 3rem);
      font-weight: 500;
      letter-spacing: -0.025em;
      line-height: 1.1;
      color: var(--bone);
    }
    .domain .tld { color: var(--muted); }

    .lede {
      margin: clamp(2rem, 4vh, 2.75rem) 0 0;
      max-width: 34rem;
      font-size: clamp(1rem, 0.95rem + 0.25vw, 1.125rem);
      line-height: 1.7;
      color: var(--muted);
      text-wrap: balance;
    }

    .rule {
      width: min(15rem, 60%);
      height: 1px;
      margin: clamp(3.5rem, 8vh, 5rem) 0 0;
      border: 0;
      background: linear-gradient(to right, transparent, var(--hairline), transparent);
    }

    .contact {
      margin-top: clamp(3.5rem, 8vh, 4.5rem);
      width: 100%;
    }

    .contact__intro {
      margin: 0;
      font-size: 0.875rem;
      line-height: 1.7;
      color: var(--muted);
    }

    .contact__name {
      margin: 1.5rem 0 0;
      font-size: 0.9375rem;
      font-weight: 500;
      letter-spacing: -0.01em;
      color: var(--bone);
    }

    .contact__links {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      margin-top: 1.125rem;
      font-size: 0.875rem;
    }

    @media (min-width: 640px) {
      .contact__links { flex-direction: row; gap: 2rem; }
    }

    /* ── Links ──────────────────────────────────────────────────────────── */

    .link {
      color: var(--muted);
      text-decoration: underline;
      text-decoration-color: rgba(250, 250, 250, 0.2);
      text-decoration-thickness: 1px;
      text-underline-offset: 4px;
      transition: color 200ms ease, text-decoration-color 200ms ease;
    }
    .link:hover,
    .link:focus-visible {
      color: var(--bone);
      text-decoration-color: rgba(250, 250, 250, 0.6);
    }
    .link:focus-visible {
      outline: 2px solid var(--bone);
      outline-offset: 4px;
      border-radius: 2px;
    }
    /* The address is the longest unbreakable run on the page; let it scale down on
       narrow viewports rather than crowd the gutters. */
    .link--mono {
      font-family: var(--font-mono);
      font-size: clamp(0.75rem, 0.62rem + 0.55vw, 0.875rem);
      overflow-wrap: anywhere;
    }

    /* ── Motion ─────────────────────────────────────────────────────────── */

    /* Fade in with a slight upward drift over 800ms, staggered down the page.
       Gated on .js so a scriptless browser is never left with hidden content. */
    .js .reveal {
      opacity: 0;
      transform: translate3d(0, 12px, 0);
      animation: reveal 800ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: var(--delay, 0ms);
      will-change: opacity, transform;
    }

    @keyframes reveal {
      to { opacity: 1; transform: translate3d(0, 0, 0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .js .reveal {
        opacity: 1 !important;
        transform: none !important;
        animation: none !important;
        will-change: auto;
      }
      * { transition-duration: 0.01ms !important; }
    }

    /* Screen-reader-only, matching Tailwind's sr-only. */
    .sr-only {
      position: absolute;
      width: 1px; height: 1px;
      padding: 0; margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border-width: 0;
    }

    @media print {
      body::before { display: none; }
      html, body { background: #fff; color: #000; }
      .lede, .contact__intro, .link { color: #333; }
    }
  </style>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Utility classes on the markup resolve through this config when the CDN is
    // reachable; the inline stylesheet above already covers the same ground.
    if (window.tailwind) {
      tailwind.config = {
        corePlugins: { preflight: false },
        theme: {
          extend: {
            colors: { ink: '#0A0A0A', bone: '#FAFAFA', muted: '#A1A1AA' },
            fontFamily: {
              sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'SF Pro Text', 'Segoe UI', 'Helvetica Neue', 'Arial', 'sans-serif'],
              mono: ['JetBrains Mono', 'SF Mono', 'ui-monospace', 'SFMono-Regular', 'Menlo', 'Consolas', 'monospace'],
            },
          },
        },
      };
    }
  </script>
</head>

<body class="bg-ink font-sans text-bone antialiased">
  <main class="stage" aria-labelledby="domain-title">
    <h1 id="domain-title" class="domain reveal" style="--delay: 80ms">
      fastestAI<span class="tld">.com</span>
    </h1>

    <p class="lede reveal" style="--delay: 220ms">
      This domain is currently held as a privately owned asset and is available for acquisition.
    </p>

    <hr class="rule reveal" style="--delay: 360ms" aria-hidden="true" />

    <footer class="contact reveal" style="--delay: 480ms">
      <h2 class="sr-only">Contact</h2>

      <p class="contact__intro">
        To initiate a transfer inquiry, contact the owner directly:
      </p>

      <p class="contact__name">Petr Hejtmánek</p>

      <div class="contact__links">
        <!-- The mailto: is assembled at runtime from the fragments below, so the
             served markup carries no harvestable address. Deliberately shipped
             without an href: until the script upgrades it this is plain text, not
             a link that goes nowhere. Without JavaScript the obfuscated form
             stays readable to a human. -->
        <a
          id="contact-email"
          class="link link--mono"
          rel="nofollow"
          data-user="petr.hejtmanek"
          data-host="limenventures"
          data-tld="com"
        >petr.hejtmanek [at] limenventures [dot] com</a>

        <a
          class="link"
          href="https://www.linkedin.com/in/petr-hejtmanek/"
          target="_blank"
          rel="noopener noreferrer nofollow"
          aria-label="Petr Hejtmánek on LinkedIn (opens in a new tab)"
        >LinkedIn</a>
      </div>
    </footer>
  </main>

  <script src="assets/app.js" defer></script>
</body>
</html>
